version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: docdrift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docdrift_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docdrift_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docdrift-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: docdrift-chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docdrift-network

  # DocDrift FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docdrift-api
    restart: unless-stopped
    environment:
      - APP_NAME=DocDrift API
      - APP_ENV=development
      - DEBUG=true
      - PORT=8000
      - HOST=0.0.0.0
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-docdrift_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docdrift_db}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_SSL=false
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - docdrift-network

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local

networks:
  docdrift-network:
    driver: bridge
